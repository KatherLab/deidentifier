[project]
name = "deidentifier"
version = "0.4.1"
description = "Locally deployable anonymizer for German clinical documents"
requires-python = ">=3.13,<3.15"
# Every dependency is pinned exactly, like the frontend's package.json: this is
# a clinical tool that ships as a container, so the version an operator runs
# should be the version that was tested. Dependabot proposes the bumps.
dependencies = [
    "fastapi==0.151.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    # Only used by the optional OIDC gate: signs the session cookie and
    # verifies the provider's id_token against its JWKS ([crypto] pulls in the
    # RSA/EC support that needs).
    "pyjwt[crypto]==2.15.1",
    "openai==3.35.1",
    "pypdf==6.21.1",
    "python-docx==1.2.0",
    "pypdfium2==5.14.0",
    "pillow==13.0.0",
    "reportlab==5.0.1",
    "pymupdf==2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.1",
]
# Documentation site (MkDocs Material). Installed on its own so neither the
# runtime image nor the test environment pulls it in:
#   uv run --only-group docs mkdocs serve
docs = [
    "mkdocs-material==9.7.7",
    "mkdocs-include-markdown-plugin==7.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
