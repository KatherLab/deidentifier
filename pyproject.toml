[project]
name = "deidentifier"
version = "0.1.0"
description = "Locally deployable anonymizer for German clinical documents"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "openai>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "reportlab>=4.2",
    "pymupdf>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
]
# Documentation site (MkDocs Material). Installed on its own so neither the
# runtime image nor the test environment pulls it in:
#   uv run --only-group docs mkdocs serve
docs = [
    "mkdocs-material>=9.6",
    "mkdocs-include-markdown-plugin>=7.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
