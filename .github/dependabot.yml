# Dependabot version updates. Unlike the workflows in this directory, this is
# safe to leave enabled on a private repository: Dependabot does not consume
# GitHub Actions minutes.
#
# Note that the tests workflow is currently workflow_dispatch-only, so nothing
# validates a Dependabot PR automatically — run the local gate (see
# docs/development/contributing.md) before merging one.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
