name: tests

# Automatic triggers are disabled while the repository is private (Actions
# minutes would be billed). Run manually via the Actions tab when needed;
# restore the push/pull_request triggers below when the repo goes public.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, format & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check backend/

      - name: Format check
        run: uv run ruff format --check backend/

      - name: Tests (includes the fake-LLM end-to-end suite)
        # Coverage floor sits a few points below the current baseline (~88%)
        # so it cannot silently regress; ratchet it up as coverage grows.
        run: >
          uv run pytest
          --cov=backend/src --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend check, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check (format, lint, types)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end smoke (Playwright)
    runs-on: ubuntu-latest

    # Drives the whole product path (paste → detection → override → export)
    # through a real browser against the real backend. Playwright boots a
    # deterministic fake OpenAI-compatible server, the backend with
    # ENV_PATH=backend/.env.e2e, and the Vite dev server — no external
    # services, no GPU, nothing to reset (the app persists nothing).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
