name: tests

# Automatic triggers are disabled while the repository is private (Actions
# minutes would be billed). Run manually via the Actions tab when needed;
# restore the push/pull_request triggers below when the repo goes public.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check backend/
      - name: Format check
        run: uv run ruff format --check backend/
      - name: Tests (includes fake-LLM end-to-end)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check (format, lint, types)
        run: npm run check
      - name: Build
        run: npm run build
