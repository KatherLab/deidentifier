name: docker-publish

# Builds the backend and frontend images. Pushes to GHCR only for a published
# release; every other run is a build-only smoke test.
#
# Automatic triggers are disabled while the repository is private (Actions
# minutes would be billed). Run manually via the Actions tab; restore the
# triggers below when the repo goes public.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#   release:
#     types: [published]
on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images to ghcr.io (otherwise build only)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
          - component: frontend
            dockerfile: Dockerfile.frontend

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Decide whether to push
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.push }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/deidentifier-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Multi-arch only when actually publishing: emulated arm64 builds are
          # slow, and a build-only smoke test does not need them.
          platforms: ${{ steps.mode.outputs.push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.mode.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
