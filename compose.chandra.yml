# GPU sidecar serving datalab-to/chandra-ocr-2 via vLLM, wired as the
# llm_vision OCR engine for scanned PDFs.
# Usage: docker compose -f compose.yml -f compose.chandra.yml up -d
#
# Prerequisites: NVIDIA GPU + NVIDIA Container Toolkit.
#
# Inside the compose network there is no port collision with the backend —
# the sidecar keeps vLLM's default port 8000 and is not published to the host.
#
# The backend settings below are set as `environment:`, which takes precedence
# over `env_file`: while this overlay is active it overrides any OCR_ENGINE /
# VISION_OCR_* you set in .env (including VISION_OCR_PROFILES, which would
# otherwise take precedence over the wiring here).

services:
  chandra-ocr:
    # Pin a tag instead of `latest` if you need a reproducible deployment.
    image: vllm/vllm-openai:latest
    ipc: host
    shm_size: "8gb"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      # Only needed while the model repo requires Hugging Face authentication.
      HF_TOKEN: ${HF_TOKEN:-}
    command: >
      --model datalab-to/chandra-ocr-2
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    environment:
      - OCR_ENGINE=llm_vision
      - VISION_OCR_API_BASE=http://chandra-ocr:8000/v1
      - VISION_OCR_MODEL=datalab-to/chandra-ocr-2
      - VISION_OCR_DIALECT=chandra
      # Profiles from .env would override the flat wiring above; this overlay
      # is single-model on purpose.
      - VISION_OCR_PROFILES=
    depends_on:
      chandra-ocr:
        condition: service_healthy
