<!doctype html>
<!-- lang is the German default; main.ts sets it to the detected/saved locale. -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply dark mode before first paint to avoid a light-mode flash.
      // localStorage['darkMode'] stores '1'/'0'; when unset, fall back to the
      // OS preference. Only the theme preference is persisted — never any
      // document content.
      ;(function () {
        try {
          var saved = localStorage.getItem('darkMode')
          var dark =
            saved !== null
              ? saved === '1'
              : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage/matchMedia unavailable — default to light */
        }
      })()
    </script>
    <title>Medizinischer Dokumenten-Anonymisierer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
