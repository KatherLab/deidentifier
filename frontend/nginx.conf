server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Re-resolve the backend hostname at request time instead of once at
    # startup, so recreated backend containers (new IP) keep working.
    # __RESOLVER__ is replaced by docker-entrypoint.d/05-resolver.sh with the
    # container network's DNS server. The variable proxy_pass below is what
    # forces per-request resolution.
    resolver __RESOLVER__ valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Must be >= the backend's APP_MAX_UPLOAD_MB (default 20 MB), or nginx
    # rejects uploads with 413 before they reach FastAPI.
    client_max_body_size 64m;

    # Document content must not be spooled to a temporary file: nginx buffers
    # any request body over client_body_buffer_size (default 16k!) and any
    # proxied response over the proxy buffers. 1 MB covers pasted text and
    # ordinary uploads in memory; anything larger goes to /tmp, which compose
    # mounts as a tmpfs so it never reaches a disk.
    client_body_buffer_size 1m;

    # ── Security headers (PHI-handling SPA; HSTS belongs on the outer
    # TLS-terminating proxy, this container listens on plain HTTP) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # script-src allows only bundled JS plus the pre-paint dark-mode inline
    # script in index.html (by sha256 hash — recompute if that script changes;
    # the browser console prints the expected value on a CSP violation).
    # frame-src blob: allows the in-app preview of the generated redacted PDF
    # (rendered from an in-memory blob URL; nothing is fetched externally).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ozG+wVMVkF/HnLHsyDc5Ap3TdAznfxbR9vyilq9Sfdo='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API proxy to the backend container. Variable proxy_pass (no URI part):
    # the original request URI is forwarded unchanged, and nginx re-resolves
    # the hostname per the resolver above.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM detection + OCR of long documents can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Stream responses through instead of buffering them: rendered pages
        # and exported PDFs are far larger than the proxy buffers and would
        # otherwise be written to /tmp/proxy_temp.
        proxy_buffering off;
    }

    # Document content must never be cached by intermediaries.
    location /api/v1/anonymize {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        # As above — and the NDJSON progress stream needs it anyway, so
        # progress events reach the browser as they are produced.
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
